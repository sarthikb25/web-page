<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nins</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  background:
    radial-gradient(circle at top left, rgba(255,180,200,.8), transparent 55%),
    radial-gradient(circle at bottom right, rgba(255,160,210,.7), transparent 60%),
    linear-gradient(135deg, #ff5f9e, #ff8dc7, #ffc3e0);
}

/* Blobs */
.floating-bg { position: fixed; inset: 0; z-index: 0; }
.blob {
  position: absolute;
  border-radius: 50%;
  opacity: .45;
  animation: float 18s ease-in-out infinite;
}
.blob1 { width:260px;height:260px;background:#ffd1e8;top:5%;left:6%; }
.blob2 { width:320px;height:320px;background:#ffb6d9;bottom:10%;right:8%;animation-delay:5s; }

@keyframes float {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(20px,-35px); }
}

/* Moon */
.moon {
  position: fixed;
  top: 8%;
  right: 10%;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff7fb, #ffd1e8, #ff9fc9);
  box-shadow: 0 0 40px rgba(255,150,200,.9);
  animation: moonFloat 12s ease-in-out infinite;
  z-index: 1;
}
@keyframes moonFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-25px); }
}

/* Content */
.content-box {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,.9);
  padding: 40px 50px;
  border-radius: 22px;
  text-align: center;
  max-width: 650px;
  width: 90%;
  transition: all .4s ease;
}

/* Message */
.message-box {
  background: linear-gradient(135deg,#fff0f7,#ffe4f0);
  padding: 24px;
  border-radius: 18px;
  margin: 25px 0 30px;
  box-shadow: inset 0 0 20px rgba(255,120,180,.25);
  transition: all .4s ease;
}

.message-box p {
  margin: 0;
  font-size: 1.2rem;
  color: #8a2c55;
}

/* Buttons */
.button-group {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.btn {
  padding: 14px 32px;
  border-radius: 30px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .25s ease;
}

.btn-primary {
  background: linear-gradient(135deg,#ff5f9e,#ff85c2);
  color: white;
}

.btn-secondary {
  background: white;
  border: 2px solid #ff85c2;
  color: #c2185b;
}

/* ===== REACTIONS ===== */

/* HAPPY */
.happy {
  animation: bounce 0.9s ease;
  box-shadow: 0 0 50px rgba(255,120,180,.9);
}
.happy .message-box {
  background: linear-gradient(135deg,#ffe8f3,#ffd1e8);
  box-shadow: 0 0 40px rgba(255,120,180,.7);
}

/* SAD */
.sad {
  animation: shake 0.7s ease;
  filter: saturate(80%);
}
.sad .message-box {
  background: linear-gradient(135deg,#ffeef4,#f5dce7);
}

/* Animations */
@keyframes bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.08) translateY(-10px); }
  60% { transform: scale(0.97); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

/* Particles */
.particle {
  position: fixed;
  font-size: 22px;
  animation: particle 1.4s ease forwards;
}
@keyframes particle {
  0% { opacity:0; transform: translateY(0) scale(.5); }
  30% { opacity:1; }
  100% { opacity:0; transform: translateY(-60px) scale(1.3); }
}
</style>
</head>

<body>

<div class="floating-bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
</div>

<div class="moon"></div>

<div class="content-box" id="box">
    <h1>Hello Nins!</h1>

    <div class="message-box" id="message">
      <p>
        Good Night… Sleep Well…
      </p>
      <div class="divider"></div>
      <p>
        Don’t be stressed 💤
      </p>
    </div>
  <div class="button-group">
    <button class="btn btn-primary" onclick="good()">Good Pink?</button>
    <button class="btn btn-secondary" onclick="bad()">Not So Good Pink?</button>
  </div>
</div>

<script>
const box = document.getElementById("box");
const msg = document.getElementById("msg");

function good() {
  reset();
  box.classList.add("happy");
  msg.innerHTML = "<p>That’s wonderful 🌸<br>Sweet dreams tonight ✨</p>";
  spawn("✨",6);
  spawn("🌸",4);
}

function bad() {
  reset();
  box.classList.add("sad");
  msg.innerHTML = "<p>It’s okay ☁️<br>Tomorrow will be gentler</p>";
  spawn("☁️",5);
}

function reset() {
  box.classList.remove("happy","sad");
}

function spawn(symbol,count){
  for(let i=0;i<count;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.textContent=symbol;
    p.style.left=Math.random()*100+"%";
    p.style.top="60%";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1400);
  }
}
</script>

</body>
</html>
