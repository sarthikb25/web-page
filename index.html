<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nins</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 180, 200, 0.8), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255, 160, 210, 0.7), transparent 60%),
        radial-gradient(circle at center, rgba(255, 200, 225, 0.4), transparent 65%),
        linear-gradient(135deg, #ff5f9e, #ff8dc7, #ffc3e0);
    }

    /* Floating blobs */
    .floating-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
      animation: float 18s ease-in-out infinite;
    }

    .blob1 { width: 260px; height: 260px; background: #ffd1e8; top: 5%; left: 6%; }
    .blob2 { width: 320px; height: 320px; background: #ffb6d9; bottom: 10%; right: 8%; animation-delay: 5s; }
    .blob3 { width: 200px; height: 200px; background: #ffc0dd; top: 55%; left: 15%; animation-delay: 9s; }

    @keyframes float {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(15px,-35px); }
    }

    /* Moon */
    .moon {
      position: fixed;
      top: 8%;
      right: 10%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff7fb, #ffd1e8 60%, #ff9fc9);
      box-shadow: 0 0 30px rgba(255,180,210,.8), 0 0 70px rgba(255,140,190,.6);
      animation: moonFloat 12s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes moonFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }

    /* Content box */
    .content-box {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(255,0,120,.25);
      max-width: 650px;
      width: 90%;
      text-align: center;
      transition: transform .4s ease;
    }

    /* Enhanced text area */
    .message-box {
      background: linear-gradient(135deg, #fff0f7, #ffe4f0);
      padding: 22px 26px;
      border-radius: 16px;
      margin: 25px 0 30px;
      box-shadow: inset 0 0 18px rgba(255,120,180,.25);
      transition: all .4s ease;
    }

    .message-box p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.6;
      color: #8a2c55;
      font-weight: 500;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(to right, #ff7eb3, #ffb6d9);
      border-radius: 10px;
      margin: 14px auto;
    }

    h1 {
      margin-top: 0;
      color: #c2185b;
      font-weight: 600;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all .3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5f9e, #ff85c2);
      color: white;
      box-shadow: 0 10px 20px rgba(255,95,158,.45);
    }

    .btn-secondary {
      background: white;
      color: #c2185b;
      border: 2px solid #ff85c2;
    }

    /* Happy + Sad states */
    .happy {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 0 30px rgba(255,120,180,.6);
    }

    .sad {
      transform: translateY(4px) scale(0.98);
      filter: grayscale(10%);
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      color: #ff7eb3;
      animation: sparkle 1.2s ease forwards;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0); }
      30% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(0.5) translateY(-20px); }
    }
  </style>
</head>

<body>

  <div class="floating-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="moon"></div>

  <div class="content-box" id="box">
    <h1>Hello Nins!</h1>

    <div class="message-box" id="message">
      <p>
        Good Night… Sleep Well…
      </p>
      <div class="divider"></div>
      <p>
        Don’t be stressed 💤
      </p>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="happy()">Good Pink?</button>
      <button class="btn btn-secondary" onclick="sad()">Not So Good Pink?</button>
    </div>
  </div>

  <script>
    const box = document.getElementById("box");

    function happy() {
      box.classList.remove("sad");
      box.classList.add("happy");
      sparkle("✨");
      sparkle("🌸");
      setTimeout(() => box.classList.remove("happy"), 900);
    }

    function sad() {
      box.classList.remove("happy");
      box.classList.add("sad");
      sparkle("☁️");
      setTimeout(() => box.classList.remove("sad"), 900);
    }

    function sparkle(symbol) {
      const s = document.createElement("div");
      s.className = "sparkle";
      s.textContent = symbol;
      s.style.left = Math.random() * 80 + 10 + "%";
      s.style.top = "60%";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  </script>

</body>
</html>
