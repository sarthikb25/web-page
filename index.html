<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nins</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;

      /* Enhanced pink dreamy background */
      background:
        radial-gradient(circle at top left, rgba(255, 180, 200, 0.8), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255, 160, 210, 0.7), transparent 60%),
        radial-gradient(circle at center, rgba(255, 200, 225, 0.4), transparent 65%),
        linear-gradient(135deg, #ff5f9e, #ff8dc7, #ffc3e0);
      background-attachment: fixed;
    }

    /* Floating background shapes */
    .floating-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.45;
      animation: float 18s ease-in-out infinite;
    }

    .blob1 {
      width: 260px;
      height: 260px;
      background: #ffd1e8;
      top: 5%;
      left: 6%;
    }

    .blob2 {
      width: 320px;
      height: 320px;
      background: #ffb6d9;
      bottom: 10%;
      right: 8%;
      animation-delay: 5s;
    }

    .blob3 {
      width: 200px;
      height: 200px;
      background: #ffc0dd;
      top: 55%;
      left: 15%;
      animation-delay: 9s;
    }

    @keyframes float {
      0%   { transform: translateY(0) translateX(0); }
      50%  { transform: translateY(-35px) translateX(15px); }
      100% { transform: translateY(0) translateX(0); }
    }

    /* Moon */
    .moon {
      position: fixed;
      top: 8%;
      right: 10%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 30%,
        #fff7fb,
        #ffd1e8 60%,
        #ff9fc9 100%
      );
      box-shadow:
        0 0 30px rgba(255, 180, 210, 0.8),
        0 0 60px rgba(255, 140, 190, 0.6),
        0 0 90px rgba(255, 120, 180, 0.4);
      animation: moonFloat 12s ease-in-out infinite;
      z-index: 1;
      opacity: 0.9;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
    }

    @keyframes moonFloat {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-25px); }
      100% { transform: translateY(0); }
    }

    /* Content box */
    .content-box {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px 50px;
      border-radius: 18px;
      box-shadow:
        0 20px 40px rgba(255, 0, 120, 0.25),
        0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 650px;
      width: 90%;
      text-align: center;
    }

    .content-box h1 {
      margin-top: 0;
      color: #c2185b;
      font-weight: 600;
    }

    .content-box p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5f9e, #ff85c2);
      color: white;
      box-shadow: 0 10px 20px rgba(255, 95, 158, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(255, 95, 158, 0.55);
    }

    .btn-secondary {
      background: white;
      color: #c2185b;
      border: 2px solid #ff85c2;
      box-shadow: 0 8px 16px rgba(255, 95, 158, 0.25);
    }

    .btn-secondary:hover {
      background: #fff0f7;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <!-- Background decorations -->
  <div class="floating-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <!-- Moon -->
  <div class="moon"></div>

  <!-- Main content -->
  <div class="content-box">
    <h1>Hello Nins!</h1>
    <p>
      Good Night... Sleep Tight...<br>
      Don’t be stressed 💤
    </p>

    <div class="button-group">
      <a href="#" class="btn btn-primary">Good Pink?</a>
      <a href="#" class="btn btn-secondary">Not So Good Pink?</a>
    </div>
  </div>

</body>
</html>
